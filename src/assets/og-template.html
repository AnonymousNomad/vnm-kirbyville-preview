<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>OG card</title>
  <style>
    @font-face {
      font-family: 'Space Grotesk';
      src: url('data:font/woff2;base64,%FONT_B64%') format('woff2');
      font-weight: 400 700;
      font-style: normal;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }
    body {
      font-family: 'Space Grotesk', system-ui, sans-serif;
      background:
        radial-gradient(58% 60% at 12% 4%, rgba(70, 224, 207, 0.16), transparent 66%),
        radial-gradient(46% 52% at 88% 88%, rgba(124, 108, 255, 0.14), transparent 70%),
        radial-gradient(40% 44% at 74% 12%, rgba(242, 165, 92, 0.10), transparent 70%),
        #05070a;
      color: #f2f5f7;
      padding: 62px 72px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }
    .rules {
      position: absolute; inset: 0;
      background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.03) 0 1px, transparent 1px 120px);
      mask-image: linear-gradient(180deg, transparent, #000 30%, #000 75%, transparent);
      -webkit-mask-image: linear-gradient(180deg, transparent, #000 30%, #000 75%, transparent);
    }
    header { display: flex; align-items: center; gap: 18px; position: relative; }
    .mark {
      width: 58px; height: 58px; border-radius: 16px;
      background: #0d1218; border: 1px solid rgba(70, 224, 207, 0.4);
      display: grid; place-items: center;
      box-shadow: 0 0 40px -12px rgba(70, 224, 207, 0.5);
    }
    .brand-name { font-size: 26px; font-weight: 600; letter-spacing: 0.01em; }
    .brand-place { font-size: 13px; letter-spacing: 0.26em; text-transform: uppercase; color: #6b7480; margin-top: 4px; }
    h1 { position: relative; font-size: 74px; line-height: 1.02; letter-spacing: -0.03em; font-weight: 600; max-width: 900px; }
    h1 span {
      background: linear-gradient(96deg, #b9f7ee, #46e0cf 46%, #22c9bd);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      -webkit-text-fill-color: transparent;
    }
    footer { position: relative; display: flex; align-items: center; gap: 16px; font-size: 17px; color: #a8b0ba; }
    .chip {
      padding: 7px 14px; border-radius: 999px; font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase;
      border: 1px solid rgba(70, 224, 207, 0.4); color: #7ff0e4; background: rgba(70, 224, 207, 0.08);
    }
    .spacer { flex: 1; }
    .note { font-size: 13px; color: #6b7480; letter-spacing: 0.14em; text-transform: uppercase; }
  </style>
</head>
<body>
  <div class="rules"></div>
  <header>
    <div class="mark">
      <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true">
        <defs>
          <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#7ff0e4" /><stop offset="1" stop-color="#22c9bd" />
          </linearGradient>
        </defs>
        <path d="M9 11 L16 23 L23 11" fill="none" stroke="url(#g)" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M12.5 7.5 q3.5 -2.6 7 0" fill="none" stroke="rgba(255,255,255,.45)" stroke-width="1.7" stroke-linecap="round" />
      </svg>
    </div>
    <div>
      <div class="brand-name">Vape N More</div>
      <div class="brand-place">Kirbyville · Texas</div>
    </div>
  </header>

  <h1>Kirbyville&rsquo;s Go-To<br /><span>Vape &amp; Smoke Shop</span></h1>

  <footer>
    <span class="chip">21+</span>
    <span>In-store shopping · Disposables · E-Liquids · Glass · Rolling Supplies</span>
    <span class="spacer"></span>
    <span class="note">Website preview</span>
  </footer>
</body>
</html>
